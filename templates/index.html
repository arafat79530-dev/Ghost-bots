<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier Ghost Controller</title>
    <!-- টেলিগ্রামের অফিসিয়াল WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1f2129);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h2 {
            margin-bottom: 5px;
            font-size: 22px;
        }
        p {
            color: var(--tg-theme-hint-color, #8e9297);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #2b2d39);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-danger {
            background-color: #e53935;
        }
        .status {
            font-weight: bold;
            font-size: 15px;
            margin-top: 10px;
            color: #4cd137;
        }
    </style>
</head>
<body>

    <h2>PREMIER GHOST</h2>
    <p>Audio Stream & Relay Controller</p>

    <div class="card">
        <div>Current Status</div>
        <div id="statusText" class="status">Streaming Active 🟢</div>
    </div>

    <div class="card">
        <button class="btn" onclick="sendCommand('mute')">Mute Audio 🔇</button>
        <button class="btn" onclick="sendCommand('unmute')">Unmute Audio 🔊</button>
        <button class="btn btn-danger" onclick="sendCommand('stop')">Stop Stream ⏹️</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // অ্যাপটি ফুল স্ক্রিন মোডে ওপেন করবে

        function sendCommand(action) {
            // ব্যাকএন্ডে রিকোয়েস্ট পাঠানোর জন্য ফেচ কল বা টেলিগ্রামে ডেটা পাঠানোর ব্যবস্থা
            fetch('/control', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ command: action })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('statusText').innerText = "Status: " + data.message;
                tg.HapticFeedback.impactOccurred('medium'); // সুন্দর ভাইব্রেশন ইফেক্ট দেবে
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
