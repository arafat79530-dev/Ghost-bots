<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Live Audio Controller</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: #1e293b;
            --btn-bg: #3b82f6;
            --btn-danger: #ef4444;
            --btn-success: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h2 { margin-bottom: 25px; font-size: 22px; }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: left;
        }
        .card h3 { margin-top: 0; font-size: 18px; color: #60a5fa; }
        p { font-size: 14px; color: #94a3b8; }
        .status { font-weight: bold; }
        .status.live { color: var(--btn-success); }
        .status.muted { color: var(--btn-danger); }
        
        button {
            background-color: var(--btn-bg);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button.danger { background-color: var(--btn-danger); }
        button.success { background-color: var(--btn-success); }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <h2>Live Audio Switcher</h2>

    <!-- নিজের গ্রুপ কার্ড -->
    <div class="card">
        <h3>নিজের গ্রুপ (Broadcasting)</h3>
        <p>স্ট্যাটাস: <span id="myGroupStatus" class="status live">লাইভ ও আনমিউটed</span></p>
        <button id="myMicBtn" class="danger" onclick="toggleMyMic()">মাইক মিউট করুন</button>
    </div>

    <!-- অন্যের গ্রুপ কার্ড -->
    <div class="card">
        <h3>অন্যের গ্রুপ (Listening Only)</h3>
        <p>স্ট্যাটাস: <span id="otherGroupStatus" class="status live">শুধু শুনছি (Connected)</span></p>
        <button id="otherAudioBtn" class="danger" onclick="toggleOtherAudio()">অন্যের গ্রুপের সাউন্ড বন্ধ করুন</button>
    </div>

    <script>
        // টেলিগ্রাম ওয়েব অ্যাপ ইনিশিয়ালাইজেশন
        let tg = window.Telegram.WebApp;
        tg.expand();

        let isMyMicMuted = false;
        let isOtherAudioMuted = false;

        function toggleMyMic() {
            isMyMicMuted = !isMyMicMuted;
            const statusEl = document.getElementById('myGroupStatus');
            const btnEl = document.getElementById('myMicBtn');

            if (isMyMicMuted) {
                statusEl.innerText = "মিউট করা আছে";
                statusEl.className = "status muted";
                btnEl.innerText = "মাইক আনমিউট করুন";
                btnEl.className = "success";
                sendActionToBackend('mute_my_mic');
            } else {
                statusEl.innerText = "লাইভ ও আনমিউটed";
                statusEl.className = "status live";
                btnEl.innerText = "মাইক মিউট করুন";
                btnEl.className = "danger";
                sendActionToBackend('unmute_my_mic');
            }
        }

        function toggleOtherAudio() {
            isOtherAudioMuted = !isOtherAudioMuted;
            const statusEl = document.getElementById('otherGroupStatus');
            const btnEl = document.getElementById('otherAudioBtn');

            if (isOtherAudioMuted) {
                statusEl.innerText = "ডিসকানেক্টেড / মিউট";
                statusEl.className = "status muted";
                btnEl.innerText = "অন্যের গ্রুপের সাউন্ড চালু করুন";
                btnEl.className = "success";
                sendActionToBackend('mute_other_group');
            } else {
                statusEl.innerText = "শুধু শুনছি (Connected)";
                statusEl.className = "status live";
                btnEl.innerText = "অন্যের গ্রুপের সাউন্ড বন্ধ করুন";
                btnEl.className = "danger";
                sendActionToBackend('unmute_other_group');
            }
        }

        // পাইথন ব্যাকএন্ডে রিকোয়েস্ট পাঠানোর ফাংশন (Web App Data বা Fetch API দিয়ে)
        function sendActionToBackend(action) {
            // টেলিগ্রাম ইউজার ডাটা সহ ব্যাকএন্ড সার্ভারে ফেচ রিকোয়েস্ট পাঠাতে পারেন
            console.log("Action sent to backend:", action);
            
            // উদাহরণস্বরূপ ব্যাকএন্ড এন্ডপয়েন্ট কল করা:
            /*
            fetch('https://your-backend-server.com/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action, user_id: tg.initDataUnsafe.user?.id })
            });
            */
        }
    </script>
</body>
</html>
